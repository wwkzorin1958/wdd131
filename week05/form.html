<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="Submit a product review for our electronics.">
    <meta name="author" content="Ricky Wong">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review-confirmation.html" id="reviewForm">
            <!-- Product Name (Dynamic) -->
            <label for="productName">Product Name <span class="required">*</span></label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
                <!-- Options will be populated by JavaScript -->
            </select>

            <!-- Overall Rating -->
            <fieldset>
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="rating-container">
                    <label>
                        <input type="radio" name="rating" value="1" required>
                        <span class="star">☆</span>
                    </label>
                    <label>
                        <input type="radio" name="rating" value="2" required>
                        <span class="star">☆</span><span class="star">☆</span>
                    </label>
                    <label>
                        <input type="radio" name="rating" value="3" required>
                        <span class="star">☆</span><span class="star">☆</span><span class="star">☆</span>
                    </label>
                    <label>
                        <input type="radio" name="rating" value="4" required>
                        <span class="star">☆</span><span class="star">☆</span><span class="star">☆</span><span class="star">☆</span>
                    </label>
                    <label>
                        <input type="radio" name="rating" value="5" required>
                        <span class="star">☆</span><span class="star">☆</span><span class="star">☆</span><span class="star">☆</span><span class="star">☆</span>
                    </label>
                </div>
            </fieldset>

            <!-- Date of Installation -->
            <label for="installDate">Date of Installation <span class="required">*</span></label>
            <input type="date" id="installDate" name="installDate" required>

            <!-- Useful Features -->
            <fieldset>
                <legend>Useful Features (Check all that apply)</legend>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="features" value="durability"> Durable</label>
                    <label><input type="checkbox" name="features" value="easeOfUse"> Easy to Use</label>
                    <label><input type="checkbox" name="features" value="performance"> High Performance</label>
                    <label><input type="checkbox" name="features" value="design"> Stylish Design</label>
                </div>
            </fieldset>

            <!-- Written Review -->
            <label for="writtenReview">Written Review (Optional)</label>
            <textarea id="writtenReview" name="writtenReview" rows="5" placeholder="Tell us what you think..."></textarea>

            <!-- User Name -->
            <label for="userName">Your Name (Optional)</label>
            <input type="text" id="userName" name="userName" placeholder="Enter your name">

            <!-- Submit Button -->
            <input type="submit" value="Submit Review">
        </form>

        <div class="counter-display">
            <p>Total Reviews Submitted: <span id="reviewCount">0</span></p>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentYear"></span> | WDD 131 | Product Review Assignment</p>
        <p>Last Updated: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
